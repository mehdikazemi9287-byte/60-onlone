<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- Brand Graphic Container -->
  <g transform="translate(10, 8)">
    <!-- '6' in Royal Blue -->
    <path d="M 32 4 C 18 4 6 16 6 34 C 6 48 16 58 32 58 C 46 58 56 48 56 34 C 56 22 46 14 34 14 C 24 14 18 20 16 28 C 18 22 24 18 32 18 C 42 18 48 24 48 34 C 48 44 40 50 32 50 C 22 50 16 42 16 34 C 16 20 24 10 32 10 C 38 10 43 13 46 17 L 52 11 C 47 6 40 4 32 4 Z" fill="#1F4FA8"/>
    
    <!-- '0' as Shopping Bag with Handle -->
    <g transform="translate(58, 6)">
      <!-- Bag Handle -->
      <path d="M 22 14 C 22 6 28 0 36 0 C 44 0 50 6 50 14" stroke="#1F4FA8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <!-- Bag Body -->
      <rect x="14" y="12" width="44" height="42" rx="10" fill="#1F4FA8"/>
      <!-- Bag cut/detail inner line -->
      <path d="M 24 22 C 28 26 44 26 48 22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Small shopping cart overlapping with speed lines -->
      <g transform="translate(30, 24)">
        <!-- Speed lines -->
        <line x1="-8" y1="4" x2="-2" y2="4" stroke="#FF6D41" stroke-width="2" stroke-linecap="round"/>
        <line x1="-12" y1="10" x2="-3" y2="10" stroke="#FF6D41" stroke-width="2" stroke-linecap="round"/>
        <line x1="-7" y1="16" x2="-1" y2="16" stroke="#FF6D41" stroke-width="2" stroke-linecap="round"/>
        <!-- Mini Cart -->
        <path d="M 2 2 L 6 2 L 11 16 L 24 16 L 27 6 L 8 6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="13" cy="20" r="2.2" fill="#FFFFFF"/>
        <circle cx="22" cy="20" r="2.2" fill="#FFFFFF"/>
      </g>
    </g>
    
    <!-- Subtitle 'ONLINE' in royal blue bold caps -->
    <text x="35" y="68" font-family="'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#1F4FA8" letter-spacing="3.5">ONLINE</text>
  </g>
  
  <!-- Divider -->
  <line x1="140" y1="18" x2="140" y2="62" stroke="#ECECEC" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Persian Wordmark 'شصت‌آنلاین' in Navy #0A2735 -->
  <g transform="translate(152, 16)">
    <text x="0" y="34" font-family="'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif" font-size="24" font-weight="900" fill="#0A2735" letter-spacing="-0.5">شصت‌آنلاین</text>
    <text x="2" y="50" font-family="'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif" font-size="10.5" font-weight="600" fill="#004E72" letter-spacing="0">تأمین هوشمند سازمانی و خانوار</text>
  </g>
</svg>